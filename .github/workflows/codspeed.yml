name: Performance Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'packages/base-ui/**'
      - 'packages/editors/**'
      - 'packages/benchmarks/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/codspeed.yml'
  pull_request:
    paths:
      - 'packages/base-ui/**'
      - 'packages/editors/**'
      - 'packages/benchmarks/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/codspeed.yml'
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: benchmarks (${{ matrix.shard }}/4)
    # CodSpeed runner v4 rejects Ubuntu 26.04, now selected by ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12.14.0
          install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @omniviewdev/base-ui build

      - run: pnpm --filter @omniviewdev/editors build

      # CPU simulation gives stable comparisons on shared GitHub-hosted runners.
      # Walltime requires dedicated macro runners for reliable measurements.
      - name: Run CPU simulation benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: |
            mkdir -p packages/benchmarks/results
            bash -o pipefail -c 'pnpm bench --shard=${{ matrix.shard }}/4 2>&1 | tee packages/benchmarks/results/codspeed-simulation.log'

      - name: Upload benchmark execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codspeed-simulation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: packages/benchmarks/results/codspeed-simulation.log
          if-no-files-found: warn
