name: Deploy Storybook

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.storybook/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: storybook-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 12.14.0
          install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build-storybook

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Sync to S3
        run: aws s3 sync storybook-static/ s3://${{ vars.STORYBOOK_S3_BUCKET }}/main/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.STORYBOOK_PROD_CF_DISTRIBUTION_ID }} \
            --paths "/*"
